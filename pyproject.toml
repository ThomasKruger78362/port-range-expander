[project]
name = "port-range-expander"
version = "0.1.1"
description = "Expand comma-and-dash port specifications like '80,443,8000-8100' into a sorted set of individual port numbers."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
